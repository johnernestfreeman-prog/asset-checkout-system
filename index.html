<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asset Checkout System — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="topbar">
  <div class="brand">ASSET<span class="tag">CHECKOUT</span></div>
</div>

<div class="auth-wrap">
  <div class="ledger-card">
    <div class="ledger-eyebrow" id="formEyebrow">Sign in</div>
    <h1 class="ledger-title" id="formTitle">Access the ledger</h1>

    <div class="msg" id="msgBox"></div>

    <form id="authForm">
      <div class="field" id="usernameField" style="display:none;">
        <label for="username">Full name</label>
        <input type="text" id="username" autocomplete="name" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Sign in</button>
    </form>

    <div class="auth-switch">
      <span id="switchPrompt">Need an account?</span>
      <a href="#" id="switchLink">Register</a>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
